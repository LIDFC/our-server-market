name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: OurServerMarket
          path: target/OurServerMarket-*.jar
          if-no-files-found: error

      - name: Publish a release for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" target/OurServerMarket-*.jar --title "OurServerMarket ${GITHUB_REF_NAME}" --generate-notes
